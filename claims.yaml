- id: functional-bait
  kind: definition
  passage: A framing is functional bait for an action when it raises that action's probability relative
    to a content-equivalent neutral framing; the difference is its bait leverage, which is specific to
    the action, since a framing can raise clicking while lowering completion.
  rationale: Central operational definition; bait leverage is action-specific, which the rest of the architecture
    depends on.
- id: five-measures
  kind: definition
  passage: These five are separate measurements.
  rationale: Leverage, strategy, deception, manipulation and harm are kept as separate axes; the paper
    declines a single bait score.
- id: compound-formula
  kind: definition
  passage: A named bait is then a sparse formula.
  rationale: 'Defines the registry''s representation: a named bait is a set of appraisal elements.'
- id: catalysts
  kind: assumption
  passage: 'Platforms act as catalysts: ranking, visible counts, low friction and personalization multiply
    the behavioral yield of an appraisal without creating it.'
  rationale: 'Modelling assumption: platform conditions multiply behavioral yield without contributing
    appraisal; the ecology implements ranking as an exposure multiplier.'
- id: structural-calibration
  kind: assumption
  passage: 'The calibration is structural: the numbers describe the model''s geometry, with directions
    anchored to the evidence above, and every downstream claim concerns the shape of the system.'
  rationale: Affinities and bonds are set by the authors with directions anchored to the cited evidence;
    downstream numbers describe the model's geometry, not measured effects.
- id: identifiability-calibration-free
  kind: interpretation
  passage: 'This result depends only on which formulas exist and is independent of calibration: naming
    has covered less than a quarter of the pair space, and estimation cannot go beyond it.'
  rationale: The rank and pair counts are properties of the incidence structure of the registry, not of
    the affinity values.
- id: heldout-internal
  kind: interpretation
  passage: Because the data are generated by the compositional model, this test shows that the Mendeleev
    test is well-posed and discriminating; it does not pass that test, and we treat it as internal consistency.
  rationale: 'States the evidential limit of the held-out test: the generating model and the predictor
    share structure.'
- id: habituation-turnover
  kind: interpretation
  passage: Accounts of engagement optimization that predict permanent capture by outrage implicitly assume
    users who do not habituate.
  rationale: Drawn from the contrast between the habituation and no-habituation runs; a property of the
    model whose plausibility rests on the cited learning literature.
- id: ethics-benign-cells
  kind: normative
  passage: 'Synthesis experiments use benign cells: the empty-cell list is public so that the first syntheses
    can be chosen for harmlessness, and deliberately inflammatory stimuli are not released for diffusion
    measurement.'
  rationale: Dual-use commitment governing which empty cells may be synthesized first.
- id: oup-rage-bait
  kind: source
  passage: Oxford's lexicographers named "rage bait" the word of 2025, defining it as content deliberately
    designed to elicit anger in order to drive traffic, and reported a threefold increase in usage over
    12 months [@oup2025].
  evidence:
    citation_id: oup2025
    locator: OUP announcement, 1 December 2025
    verified: true
    verification_note: 'Fetched corp.oup.com: rage bait defined as online content deliberately designed
      to elicit anger or outrage ... to increase traffic or engagement; ''The word has tripled in usage
      in the last 12 months.'''
- id: meta-engagement-bait
  kind: source
  passage: Dozens of related terms surround it, and platforms maintain their own policy categories, defining
    engagement bait through the actions it solicits [@meta2017].
  evidence:
    citation_id: meta2017
    locator: Newsroom post, 18 December 2017
    verified: true
    verification_note: 'Fetched about.fb.com: posts that goad people into interacting through likes, shares,
      comments and other actions are ''engagement bait'' and will be demoted.'
- id: robertson-23
  kind: source
  passage: 'On clicking: in roughly 105,000 headline experiments from the Upworthy archive, each additional
    negative word raised click-through by about 2.3 percent [@robertson2023]; headline concreteness has
    non-monotonic effects, with maximal vagueness underperforming, so the curiosity gap has an optimum
    [@aubin2025]; and headlines labeled clickbait by detectors did not reliably attract more clicks, with
    4 automated detectors agreeing on the label 47 percent of the time, consistent with a category that
    is not a natural kind [@molina2021].'
  evidence:
    citation_id: robertson2023
    locator: Abstract
    verified: true
    verification_note: 'Crossref abstract: ~105,000 variations of Upworthy news stories; for a headline
      of average length each additional negative word increased click-through rate by 2.3%.'
- id: molina-47
  kind: source
  passage: 'On clicking: in roughly 105,000 headline experiments from the Upworthy archive, each additional
    negative word raised click-through by about 2.3 percent [@robertson2023]; headline concreteness has
    non-monotonic effects, with maximal vagueness underperforming, so the curiosity gap has an optimum
    [@aubin2025]; and headlines labeled clickbait by detectors did not reliably attract more clicks, with
    4 automated detectors agreeing on the label 47 percent of the time, consistent with a category that
    is not a natural kind [@molina2021].'
  evidence:
    citation_id: molina2021
    locator: Abstract (Study 3)
    verified: true
    verification_note: 'OpenAlex abstract: users do not reliably click more on classifier-labeled clickbait;
      in a computational analysis of four classifiers the detectors agreed on a classification only 47%
      of the time.'
- id: rathje-outgroup
  kind: source
  passage: 'On sharing: moral-emotional words increase diffusion [@brady2017], and across 2.73 million
    posts, out-group language was the strongest predictor, roughly doubling sharing [@rathje2021], which
    justifies treating out-group reference as a separate element from negativity.'
  evidence:
    citation_id: rathje2021
    locator: Abstract
    verified: true
