- id: fear-phishing
  kind: interpretation
  passage: Fearbait and doombait group with phishing, credential bait and streak bait in a fear-and-return
    cluster, because doom-scrolling media and credential-harvesting scams share a basis of threat, uncertainty
    and compulsive checking that the vernacular families separate.
