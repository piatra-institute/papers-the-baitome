abstract: 'Oxford''s lexicographers chose "rage bait" as the word of the year for 2025, reporting a threefold
  rise in use, and the working vocabulary of the internet now names dozens of baits: clickbait, flamebait,
  fearbait, thirst bait, correction bait, dunk bait, FOMO bait, engagement bait. The names mix levels
  of description (a target action, an emotion, a social outcome, a platform objective, a deceptive relation),
  and one post can carry several of them. We treat named baits as compounds of psychological elements
  and build a four-layer system: about 32 candidate appraisal elements in 7 families, an alphabet of 12
  actions, action-specific bonds between elements, and platform conditions acting as catalysts that multiply
  exposure without creating appraisal. A registry of 40 named baits as sparse formulas (mean size 3.3)
  has 0 formula collisions against 50 collisions in top-action space. Clustering compounds by simulated
  behavioral signature recovers the vernacular families at purity 0.6: ragebait forms a singleton cluster,
  and fearbait groups with phishing. The registry identifies linear element affinities (correlation 0.95),
  but the bond design is rank-deficient by 106 parameters, and 382 of 496 element pairs occur in no named
  compound. A held-out compound''s signature is predicted from its formula with relative error 0.20, against
  0.63 for the family mean, a test of internal consistency only. In an ecology of learning creators, habituating
  users and engagement ranking, ranking concentrates production and tilts the feed toward conflict; without
  habituation the conflict share locks at 0.64, and with it dominance changes 115 times. We specify the
  field programme and the criteria under which the periodic-table analogy would fail.'
web_blurb: Named baits such as clickbait and ragebait treated as compounds of about 32 appraisal elements.
  A registry of 40 baits shows that the vocabulary cannot identify most element interactions, and user
  habituation breaks the rage-farming lock.
